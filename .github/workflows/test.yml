name: Test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Syntax, unit and controller checks
        run: npm run check
      - name: Measure bounded synthetic extraction
        run: npm run benchmark
      - name: Install pinned official browser tooling
        run: npm install --no-save --ignore-scripts playwright@1.62.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Real browser functionality, privacy and responsive checks
        run: npm run test:browser
      - name: Retain synthetic test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notice-change-reviewer-evidence
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7
